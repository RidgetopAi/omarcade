[package]
name = "omarcade-pixel-break"
description = "Pixel Break — ten levels of bricks, power-ups and particles. The Omarcade release title."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# omarcade-core and nothing else. winit and softbuffer are deliberately
# absent: a game cannot import what it does not depend on, which makes
# the rendering seam a fact about the build rather than a convention we
# have to remember to follow.
[dependencies]
omarcade-core = { path = "../../core" }
