[workspace]
resolver = "3"
members = ["core", "games/*"]

# Shared metadata. Members inherit with `version.workspace = true` etc.,
# so a release bump happens in exactly one place.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/RidgetopAi/omarcade"
authors = ["Brian Ridgetopai"]

# Versions are pinned HERE and nowhere else. Members write
# `winit.workspace = true`. This is what keeps game 3 from silently
# drifting onto a different winit than core.
#
# Note which crates are absent by design: no game package depends on
# winit, softbuffer or cpal. They cannot import what they do not list —
# a game reaches the speakers through omarcade-core's audio seam or not
# at all.
[workspace.dependencies]
cpal = "0.18.2"
winit = "0.30.13"
softbuffer = "0.4.8"
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Decoding the Omarchy theme's background image for the racer's sky.
# ⚠️ These two rather than the `image` crate: `image` pulls 26 transitive
# crates to provide the same two decoders, where this is 6, all pure Rust
# with no system libraries. The theme directory only ever holds JPEG and
# PNG, so wider format support would be paying for reach nothing uses.
zune-jpeg = "0.5.15"
zune-png = "0.5.2"

# Games are latency-sensitive; an unoptimized dep tree drops frames even
# in a debug build. Optimize dependencies, keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2
